<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<style>
  :root{
    --bg:#121110; --surface:#1c1a18; --line:#2c2925;
    --gold:#e3b23c; --red:#b8352b; --green:#4caf7d;
    --text:#f4efe6; --muted:#a99f8f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:26px;}
  h1{font-size:18px; margin:0 0 6px;}
  p.hint{color:var(--muted); font-size:13px; margin:0 0 20px; line-height:1.5;}
  .field-label{font-size:12px; color:var(--gold); font-weight:600; margin:12px 0 6px; display:block;}
  .field-input{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; color:var(--text); font-size:14px;
  }
  .primary-btn{
    width:100%; margin-top:18px; background:var(--gold); color:#1a1408; border:none; border-radius:10px;
    padding:13px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .primary-btn:disabled{opacity:.6; cursor:default;}
  .status-msg{font-size:13px; margin-top:12px; min-height:16px; line-height:1.5;}
  .status-msg.error{color:var(--red);}
  .status-msg.ok{color:var(--green);}
  a{color:var(--gold);}
  .back{display:none; margin-top:16px; text-align:center; font-size:13px;}
  .brand{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:0 0 10px;}
</style>
</head>
<body>

<div class="card">
  <p class="brand" id="brand"></p>
  <h1 id="title">Set a new password</h1>
  <p class="hint" id="hint">Choose a new password for your account.</p>

  <div id="formWrap">
    <label class="field-label">New password</label>
    <input class="field-input" id="newPassword" type="password" autocomplete="new-password" maxlength="72" placeholder="At least 8 characters">
    <label class="field-label">Confirm password</label>
    <input class="field-input" id="confirmPassword" type="password" autocomplete="new-password" maxlength="72">
    <button class="primary-btn" id="submitBtn">Update password</button>
  </div>

  <p class="status-msg" id="statusMsg" role="status"></p>
  <p class="back" id="back"><a href="/">Back to the menu</a></p>
</div>

<script>
const API_BASE = window.location.origin;

// Supabase's password-recovery redirect appends the session tokens as a
// URL *fragment* (after #), e.g.:
//   /reset-password.html#access_token=...&refresh_token=...&type=recovery
function getRecoveryToken(){
  const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
  const params = new URLSearchParams(hash);
  if(params.get('type') !== 'recovery') return null;
  return params.get('access_token');
}

const accessToken = getRecoveryToken();
const statusMsg = document.getElementById('statusMsg');

// Show the restaurant this link belongs to (the host picks it). Purely cosmetic: failures are ignored.
fetch(`${API_BASE}/api/config`).then((r) => (r.ok ? r.json() : null)).then((c) => {
  if(c && c.brand){ document.getElementById('brand').textContent = c.brand; document.title = `Reset your password — ${c.brand}`; }
}).catch(() => {});

function setStatus(message, kind){
  statusMsg.textContent = message;
  statusMsg.className = 'status-msg' + (kind ? ` ${kind}` : '');
}

if(!accessToken){
  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('title').textContent = 'This link is invalid';
  document.getElementById('hint').textContent = 'Please request a new password reset link from the menu page.';
  document.getElementById('back').style.display = 'block';
}else{
  // Clear the token out of the visible URL/history once we've read it,
  // so it doesn't linger in browser history or get shared accidentally.
  history.replaceState(null, '', window.location.pathname);
}

document.getElementById('submitBtn')?.addEventListener('click', async () => {
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if(newPassword.length < 8 || newPassword.length > 72){
    setStatus('Password must be 8 to 72 characters.', 'error');
    return;
  }
  if(newPassword !== confirmPassword){
    setStatus('Passwords do not match.', 'error');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  setStatus('Updating…');

  try{
    const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: accessToken, new_password: newPassword }),
    });
    const result = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(result.error || 'Could not update your password.');

    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('title').textContent = 'Password updated';
    document.getElementById('hint').textContent = 'You can now sign in with your new password.';
    setStatus('Done. Go back to the menu to sign in.', 'ok');
    document.getElementById('back').style.display = 'block';
  }catch(err){
    setStatus(err.message || 'Something went wrong.', 'error');
  }finally{
    btn.disabled = false;
  }
});
</script>
</body>
</html>
