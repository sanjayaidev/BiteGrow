<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Videos</title>
<style>
body{background:#121110;color:#f4efe6;font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}
h1{font-size:20px}.card{background:#1c1a18;border:1px solid #2c2925;border-radius:12px;padding:14px;margin:12px 0}
.card h2{margin:0 0 4px;font-size:15px}.card p{margin:0 0 10px;color:#a99f8f;font-size:12px}
img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000;margin-bottom:10px}
button{background:#e3b23c;color:#1a1408;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}.msg{font-size:12px;margin-top:8px;white-space:pre-wrap}.ok{color:#7ad17a}.bad{color:#ff8a7a}
</style></head><body>
<h1>Replace videos</h1>
<p style="color:#a99f8f;font-size:13px">Upload a clip; the server converts it with ffmpeg. Hero is trimmed to 30 s, popular clips to 12 s. Both play by scroll position, not autoplay.</p>
<div id="cards"></div>
<p><a href="/" style="color:#e3b23c">← Back to site</a></p>
<script>
const slots=[['hero','Hero (scroll video)','Short clip, 10–20 s works best'],['pop1','Popular · card 1','Scrubs with scroll in a 16:9 card; 5–10 s works best'],['pop2','Popular · card 2',''],['pop3','Popular · card 3','']];
const root=document.getElementById('cards');
slots.forEach(([id,t,h])=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h2>${t}</h2><p>${h}</p><img id="i-${id}" src="/videos/${id}.jpg?${Date.now()}" alt=""><input type="file" accept="video/*"> <button>Upload</button><div class="msg"></div>`;
  root.appendChild(c);
  const btn=c.querySelector('button'),file=c.querySelector('input'),msg=c.querySelector('.msg');
  btn.onclick=async()=>{
    if(!file.files[0]){msg.className='msg bad';msg.textContent='Choose a file first';return}
    const fd=new FormData();fd.append('video',file.files[0]);
    btn.disabled=true;msg.className='msg';msg.textContent='Uploading and encoding… (can take a minute)';
    try{
      const r=await fetch('/api/upload/'+id,{method:'POST',body:fd});const j=await r.json();
      if(!r.ok)throw new Error((j.error||'Failed')+(j.detail?'\n'+j.detail:''));
      msg.className='msg ok';msg.textContent='Done. Refresh the site (Ctrl+F5) to see it.';
      document.getElementById('i-'+id).src='/videos/'+id+'.jpg?'+j.v;
    }catch(e){msg.className='msg bad';msg.textContent=e.message}
    btn.disabled=false;
  };
});
</script></body></html>
